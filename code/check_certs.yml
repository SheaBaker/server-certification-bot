---
- name: https cert expiry check (IIS/DigiCert)
  hosts: localhost
  gather_facts: no

  vars:
    warn_days: 50000
    webex_bot_token: "YOUR_BOT_TOKEN_HERE"
    webex_room_id: "YOUR_ROOM_ID_HERE"

    targets:
      # development environment
      - { name: "server-name",      host: "server-ip",    port: port-number, server_name: "server.domain.com" }

      # testing environment
      - { name: "server-name",      host: "server-ip",    port: port-number, server_name: "server.domain.com" }

      # production environment
      - { name: "server-name",      host: "server-ip",    port: port-number, server_name: "server.domain.com" }

  tasks:
    - name: get certs (no SNI)
      community.crypto.get_certificate:
        host: "{{ item.host }}"
        port: "{{ item.port }}"
        timeout: 10
      loop: "{{ targets }}"
      loop_control:
        label: "{{ item.name }}"
      when: (item.server_name | default('') | string | length) == 0
      register: certs_no_sni
      ignore_errors: yes

    - name: get certs (with SNI)
      community.crypto.get_certificate:
        host: "{{ item.host }}"
        port: "{{ item.port }}"
        server_name: "{{ item.server_name }}"
        timeout: 10
      loop: "{{ targets }}"
      loop_control:
        label: "{{ item.name }}"
      when: (item.server_name | default('') | string | length) > 0
      register: certs_sni
      ignore_errors: yes

    - name: combine results
      set_fact:
        certs:
          results: "{{ (certs_no_sni.results | default([])) + (certs_sni.results | default([])) }}"

    - name: prepare cert data for python
      set_fact:
        cert_data: "{{ cert_data | default([]) + [{'name': item.item.name, 'endpoint': item.item.host ~ ':' ~ item.item.port ~ ((' SNI ' ~ item.item.server_name) if item.item.server_name | default('') | length > 0 else ''), 'not_after': item.not_after | default(''), 'failed': item.failed}] }}"
      loop: "{{ certs.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: write cert data to temp file
      copy:
        content: "{{ cert_data | to_json }}"
        dest: file-directory.json

    - name: run expiry check
      command: python3 file-directory.py file-directory.json {{ warn_days }}
      register: expiry_output

    - name: parse expiry results
      set_fact:
        expiry_result: "{{ expiry_output.stdout | from_json }}"

    - name: print report to console
      debug:
        msg: "{{ expiry_result.message }}"

    - name: send webex notification
      uri:
        url: "https://webexapis.com/v1/messages"
        method: POST
        headers:
          Authorization: "Bearer {{ webex_bot_token }}"
        body_format: json
        body:
          roomId: "{{ webex_room_id }}"
          markdown: "{{ expiry_result.message }}"
      when: webex_bot_token | length > 0

    - name: fail if any certs are expiring or errored
      fail:
        msg: "Certificate alerts detected"
      when: expiry_result.has_alerts
